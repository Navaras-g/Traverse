services:
  postgres:
    image: postgres:16-alpine
    container_name: traverse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: traverse
      POSTGRES_PASSWORD: traverse
      POSTGRES_DB: traverse
    ports:
      - "5433:5432" # host:container — 5433 avoids clashing with your native Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U traverse" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: traverse_redis
    restart: unless-stopped
    ports:
      - "6380:6379" # host:container — 6380 to be safe, avoids common Redis default
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: traverse_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: traverse_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
